<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="WearWise: turn your own clothing photos into three explainable outfits."
    />
    <meta name="theme-color" content="#f5f5f7" />
    <title>WearWise</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

    <header class="topbar">
      <button class="brand" type="button" data-route="home" aria-label="Return home">
        <span class="brand-mark" aria-hidden="true">◌</span>
        <span>WearWise</span>
      </button>
      <nav aria-label="Main navigation">
        <button type="button" data-route="wardrobe">Wardrobe</button>
        <button type="button" data-route="occasion">Style me</button>
        <button id="contrast-button" type="button" aria-pressed="false">
          Contrast
        </button>
      </nav>
    </header>

    <main id="main" tabindex="-1">
      <section id="home-screen" class="screen" data-screen="home">
        <p class="eyebrow">WEARWISE · INTERACTIVE PROTOTYPE</p>
        <h1>Dress with more confidence.</h1>
        <p class="lead">Your photos keep their real color. The interface stays clear, monochrome, and easy to scan.</p>

        <div class="hero-actions">
          <button class="action-card primary" type="button" data-route="wardrobe">
            <span class="action-icon" aria-hidden="true">⌂</span>
            <span>
              <strong>My wardrobe</strong>
              <small id="wardrobe-summary">Loading</small>
            </span>
            <span aria-hidden="true">›</span>
          </button>
          <button class="action-card" type="button" data-route="occasion">
            <span class="action-icon" aria-hidden="true">✦</span>
            <span>
              <strong>What should I wear?</strong>
              <small>Enter an occasion and get three outfits</small>
            </span>
            <span aria-hidden="true">›</span>
          </button>
        </div>

        <section id="recent-plan-section" class="section" hidden>
          <div class="section-heading">
            <h2>Recent outfit</h2>
          </div>
          <div id="recent-plan"></div>
        </section>
      </section>

      <section id="wardrobe-screen" class="screen" data-screen="wardrobe" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">PHOTO WARDROBE</p>
            <h1>My clothes</h1>
          </div>
          <button id="load-demo-button" class="outline-button" type="button">
            Load demo wardrobe
          </button>
        </div>

        <form id="garment-form" class="panel form-panel">
          <h2>Add a garment</h2>
          <div class="form-grid">
            <label>
              Garment photo
              <input id="garment-photo" type="file" accept="image/*" required />
            </label>
            <label>
              Garment name
              <input id="garment-name" type="text" placeholder="Light blue Oxford shirt" required />
            </label>
            <label>
              Garment type
              <select id="garment-slot" required>
                <option value="top">Top</option>
                <option value="bottom">Bottom</option>
                <option value="shoes">Shoes</option>
                <option value="outerwear">Outerwear</option>
              </select>
            </label>
            <label>
              Colors
              <input id="garment-colors" type="text" placeholder="Light blue, white" />
            </label>
            <label>
              Formality
              <select id="garment-formality">
                <option value="1">1 · Very casual</option>
                <option value="2">2 · Casual</option>
                <option value="3" selected>3 · Smart casual</option>
                <option value="4">4 · Business</option>
                <option value="5">5 · Formal</option>
              </select>
            </label>
          </div>
          <button class="primary-button" type="submit">Save garment</button>
        </form>

        <div id="wardrobe-grid" class="wardrobe-grid"></div>
      </section>

      <section id="occasion-screen" class="screen" data-screen="occasion" hidden>
        <p class="eyebrow">OCCASION</p>
        <h1>Where are you going?</h1>

        <label class="large-field">
          <span>Describe the occasion</span>
          <input
            id="occasion-input"
            type="text"
            placeholder="For example: first dinner with my partner's family"
            autocomplete="off"
          />
        </label>

        <label class="single-field">
          <span>Formality</span>
          <select id="occasion-formality">
            <option value="casual">Casual</option>
            <option value="smart_casual" selected>Smart casual</option>
            <option value="business">Business</option>
            <option value="formal">Formal</option>
          </select>
        </label>

        <div class="preset-list" aria-label="Suggested occasions">
          <button type="button" data-preset="First date">First date</button>
          <button type="button" data-preset="Club presentation">Club presentation</button>
          <button type="button" data-preset="Friends dinner">Friends dinner</button>
          <button type="button" data-preset="Internship interview">Internship interview</button>
        </div>

        <button id="generate-button" class="primary-button" type="button">
          Generate three outfits
        </button>

        <section id="occasion-result" class="panel result-summary" hidden></section>
      </section>

      <section id="results-screen" class="screen" data-screen="results" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">THREE OUTFITS</p>
            <h1 id="results-title">Your edit</h1>
          </div>
          <button class="outline-button" type="button" data-route="occasion">
            Change occasion
          </button>
        </div>
        <p id="results-note" class="lead"></p>
        <div id="outfit-list" class="outfit-list"></div>
      </section>
    </main>

    <dialog id="detail-dialog" class="detail-dialog">
      <button id="close-detail" class="dialog-close" type="button" aria-label="Close">
        ×
      </button>
      <div id="detail-content"></div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="data.js"></script>
    <script src="engine.js"></script>
    <script src="app.js"></script>
  </body>
</html>
