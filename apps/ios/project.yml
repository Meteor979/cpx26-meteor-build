name: WearWise

options:
  bundleIdPrefix: com.wearwise
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"

targets:
  WearWise:
    type: application
    platform: iOS
    sources:
      - path: WearWise
    info:
      path: WearWise/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wearwise.accessible
        PRODUCT_NAME: WearWise
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: minimal

  WearWiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WearWiseTests
    dependencies:
      - target: WearWise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wearwise.accessible.tests
        GENERATE_INFOPLIST_FILE: "YES"

schemes:
  WearWise:
    build:
      targets:
        WearWise: all
        WearWiseTests: [test]
    test:
      targets:
        - WearWiseTests
    run:
      config: Debug
    archive:
      config: Release
