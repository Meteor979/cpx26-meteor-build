<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WearWise 演示衣柜资源预览</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
        background: Canvas;
        color: CanvasText;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 56px; }
      header { display: grid; gap: 12px; margin-bottom: 28px; }
      h1 { margin: 0; font-size: clamp(32px, 6vw, 56px); letter-spacing: -0.04em; }
      p { margin: 0; line-height: 1.6; }
      .notice { padding: 14px 16px; border: 2px solid CanvasText; border-radius: 14px; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      button {
        min-height: 52px;
        padding: 12px 18px;
        border: 2px solid CanvasText;
        border-radius: 14px;
        color: CanvasText;
        background: Canvas;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary { color: Canvas; background: CanvasText; }
      button:focus-visible { outline: 4px solid Highlight; outline-offset: 3px; }
      #status { min-height: 24px; font-weight: 600; }
      section { margin-top: 34px; }
      h2 { padding-bottom: 10px; border-bottom: 2px solid CanvasText; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
      article { padding: 10px; border: 1px solid CanvasText; border-radius: 16px; }
      img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: contain; background: Canvas; border-radius: 10px; }
      h3 { margin: 10px 0 4px; font-size: 16px; }
      small { display: block; line-height: 1.5; }
      .missing { display: grid; min-height: 240px; place-items: center; border: 2px dashed CanvasText; border-radius: 10px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p><strong>DEMO WARDROBE · 28 ITEMS</strong></p>
        <h1>演示衣柜照片包</h1>
        <p>正式程度已分层；保暖评分等待天气模块接入。</p>
        <div class="notice">
          本页面只读取仓库内图片。点击“载入演示衣柜”后，数据仅保存在当前浏览器的
          localStorage 中。
        </div>
        <div class="actions">
          <button id="import-button" class="primary" type="button">载入演示衣柜</button>
          <button id="clear-button" type="button">清除浏览器数据</button>
        </div>
        <p id="status" role="status" aria-live="polite">正在读取分类清单…</p>
      </header>
      <div id="wardrobe"></div>
    </main>
    <script type="module">
      import {
        clearStoredDemoWardrobe,
        groupGarmentsBySlot,
        loadDemoWardrobe,
        storeDemoWardrobe
      } from "./importer.js";

      const labels = {
        top: "上装",
        bottom: "下装",
        shoes: "鞋",
        outerwear: "外套"
      };
      const formalityLabels = ["", "休闲", "休闲", "智能休闲", "商务", "正式"];
      const status = document.querySelector("#status");
      const wardrobeRoot = document.querySelector("#wardrobe");
      let wardrobe;

      function render() {
        const grouped = groupGarmentsBySlot(wardrobe.garments);
        wardrobeRoot.innerHTML = Object.entries(labels)
          .map(([slot, label]) => {
            const items = grouped[slot];
            return `
              <section aria-labelledby="section-${slot}">
                <h2 id="section-${slot}">${label} · ${items.length} 件</h2>
                <div class="grid">
                  ${items
                    .map(
                      (item) => `
                        <article>
                          <img
                            src="${item.thumbnail_url}"
                            alt="${item.name}的照片"
                            loading="lazy"
                            onerror="this.outerHTML='<div class=&quot;missing&quot;>${item.name}<br>照片缺失</div>'"
                          />
                          <h3>${item.name}</h3>
                          <small>${item.colors.join("、")} · ${item.category}</small>
                          <small>正式度 ${item.formality_score}/5 · ${formalityLabels[item.formality_score]}</small>
                          <small>保暖评分待天气模块补充</small>
                        </article>
                      `
                    )
                    .join("")}
                </div>
              </section>
            `;
          })
          .join("");
      }

      document.querySelector("#import-button").addEventListener("click", () => {
        storeDemoWardrobe(wardrobe);
        status.textContent = `已载入 ${wardrobe.garments.length} 件演示衣物。`;
      });

      document.querySelector("#clear-button").addEventListener("click", () => {
        clearStoredDemoWardrobe();
        status.textContent = "已清除当前浏览器中的演示衣柜数据。";
      });

      try {
        wardrobe = await loadDemoWardrobe();
        render();
        status.textContent = `读取成功：${wardrobe.garments.length} 件衣物。`;
      } catch (error) {
        status.textContent = `读取失败：${error.message}`;
        status.setAttribute("role", "alert");
      }
    </script>
  </body>
</html>
